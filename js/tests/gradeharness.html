<!doctype html>
<!--
  GPU harness for the grade maths.

  `js/radiance_grade.js` emits GLSL and WGSL from the same file as its JS
  functions, which removes the *opportunity* for the backends to disagree but
  does not by itself prove the transliteration is right. This page compiles the
  emitted GLSL in a real WebGL2 context and compares it to the JS, pixel by
  pixel, over the grade settings a user can actually reach.

  The WGSL half is checked by `js/tests/wgslharness.mjs`, which does the same
  thing on a real WebGPU device under Deno -- headless Chromium has no
  `navigator.gpu` at all, so the two dialects need two runtimes.

  Driven by `js/tests/grade_gpu.test.mjs`.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Radiance — grade GPU harness</title></head>
<body>
<canvas id="c" width="4" height="4"></canvas>
<script type="module">
import {
    GLSL, gradePixel, applyWhiteBalance, applyLumaMix, linToACEScct, acescctToLin, toAP1, fromAP1,
} from '../radiance_grade.js';

const VERT = `#version 300 es
in vec2 a_position;
void main() { gl_Position = vec4(a_position, 0.0, 1.0); }`;

// main() applies the emitted helpers in the same order gradePixel() does. If
// the order here and there diverge, the comparison fails — which is the point.
const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec3 u_in, u_offset, u_lift, u_gain, u_gamma;
uniform float u_contrast, u_pivot, u_sat;
${GLSL}
void main() {
    vec3 c = radGradeOrder(u_in, u_offset, u_lift, u_gain, u_gamma);
    if (u_contrast != 1.0) c = radContrast(c, u_contrast, u_pivot);
    if (u_sat != 1.0) c = radSaturation(c, u_sat);
    fragColor = vec4(c, 1.0);
}`;

window.__run = () => {
    const out = { ok: false, cases: [] };
    const gl = document.getElementById('c').getContext('webgl2');
    if (!gl) { out.error = 'no webgl2 context'; return out; }
    if (!gl.getExtension('EXT_color_buffer_float')) {
        out.error = 'EXT_color_buffer_float unavailable — cannot compare without quantising';
        return out;
    }

    const mk = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
    };
    let prog;
    try {
        prog = gl.createProgram();
        gl.attachShader(prog, mk(gl.VERTEX_SHADER, VERT));
        gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FRAG));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    } catch (e) {
        out.error = 'the emitted GLSL did not compile: ' + String(e.message).slice(0, 600);
        return out;
    }
    out.compiled = true;

    const fbo = gl.createFramebuffer(), rt = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, rt);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 4, 4, 0, gl.RGBA, gl.FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rt, 0);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.useProgram(prog);
    const loc = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const u = (n) => gl.getUniformLocation(prog, n);
    const buf = new Float32Array(4 * 4 * 4);

    // The extremes the sliders reach, not a comfortable middle: gamma 0 and
    // contrast 99 are where the old unguarded paths produced Infinity, and
    // pivot 0 is where the power form produced NaN.
    const pixels = [[0,0,0], [0.18,0.18,0.18], [1,1,1], [4,2,0.5], [-0.3,0.2,0.9], [0.05,0.5,12]];
    const grades = [
        {},
        { lift: [0.1, 0.05, 0], gain: [1.2, 1, 0.9] },
        { gamma: [2.2, 2.2, 2.2] },
        { gamma: [0, 0, 0] },
        { contrast: 1.6, pivot: 0.18 },
        { contrast: 99, pivot: 0 },
        { contrast: 0, pivot: 0.5 },
        { saturation: 0 },
        { saturation: 2.5 },
        { offset: [0.02, -0.02, 0], lift: [0.2, 0, -0.1], gain: [2, 0.5, 1],
          gamma: [0.5, 1, 2.4], contrast: 3, pivot: 0.3, saturation: 1.8 },
    ];

    for (const g of grades) {
        const o = { offset: [0,0,0], lift: [0,0,0], gain: [1,1,1], gamma: [1,1,1],
                    contrast: 1, pivot: 0.18, saturation: 1, ...g };
        gl.uniform3fv(u('u_offset'), o.offset);
        gl.uniform3fv(u('u_lift'), o.lift);
        gl.uniform3fv(u('u_gain'), o.gain);
        gl.uniform3fv(u('u_gamma'), o.gamma);
        gl.uniform1f(u('u_contrast'), o.contrast);
        gl.uniform1f(u('u_pivot'), o.pivot);
        gl.uniform1f(u('u_sat'), o.saturation);
        for (const px of pixels) {
            gl.uniform3fv(u('u_in'), px);
            gl.viewport(0, 0, 4, 4);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.readPixels(0, 0, 4, 4, gl.RGBA, gl.FLOAT, buf);
            const gpu = [buf[0], buf[1], buf[2]];
            const cpu = gradePixel(px, o);
            // Relative where the values are large, absolute where they are
            // small: fp32 in the shader against fp64 in JS.
            // fp32 tops out around 3.4e38. gamma 0.01 raises an over-range
            // scene-linear pixel to the power of 100, so 4.0 becomes 1.6e60 —
            // representable in JS's fp64 and not in the shader's fp32. That is
            // a range limit of the format, not a disagreement about the
            // formula, so those samples are marked and compared separately.
            const representable = cpu.every((v) => Math.abs(v) < 3.4e38);
            const delta = representable
                ? Math.max(...gpu.map((v, i) => Math.abs(v - cpu[i]) / Math.max(1, Math.abs(cpu[i]))))
                : null;
            out.cases.push({ grade: g, in: px, gpu, cpu, delta, representable });
        }
    }
    out.ok = true;
    return out;
};

// The helpers the composite shader uses one at a time: white balance, luma mix,
// the ACEScct curve and the gamut matrices. Each is compared to its JS twin.
const FRAG_OPS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec3 u_in, u_p;
uniform int u_op, u_gamut;
${GLSL}
void main() {
    vec3 c = u_in;
    if (u_op == 0) c = radWhiteBalance(u_in, u_p.x, u_p.y);
    if (u_op == 1) c = radLumaMix(u_in, u_p.x, u_p.y);
    if (u_op == 2) c = radLinToACEScct(u_in);
    if (u_op == 3) c = radACEScctToLin(u_in);
    if (u_op == 4) c = radToAP1(u_in, u_gamut);
    if (u_op == 5) c = radFromAP1(u_in, u_gamut);
    if (u_op == 6) c = radFromAP1(radACEScctToLin(radLinToACEScct(radToAP1(u_in, u_gamut))), u_gamut);
    fragColor = vec4(c, 1.0);
}`;

window.__runOps = () => {
    const out = { ok: false, cases: [] };
    // The basic (fallback) shader splices the same block, and it is built as
    // GLSL ES 1.00 when the context is WebGL1, so the block has to compile there.
    {
        const gl1 = document.createElement('canvas').getContext('webgl');
        if (gl1) {
            const sh = gl1.createShader(gl1.FRAGMENT_SHADER);
            gl1.shaderSource(sh, `precision highp float;\n${GLSL}\nvoid main() { gl_FragColor = vec4(radContrast(vec3(0.5), 2.0, 0.18) + radLinToACEScct(vec3(0.2)) + radToAP1(vec3(0.1), 0), 1.0); }`);
            gl1.compileShader(sh);
            out.es100 = gl1.getShaderParameter(sh, gl1.COMPILE_STATUS) ? true : gl1.getShaderInfoLog(sh);
        } else out.es100 = 'no webgl1 context';
    }
    const gl = document.createElement('canvas').getContext('webgl2');
    if (!gl || !gl.getExtension('EXT_color_buffer_float')) { out.error = 'no float webgl2'; return out; }
    const mk = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
    };
    let prog;
    try {
        prog = gl.createProgram();
        gl.attachShader(prog, mk(gl.VERTEX_SHADER, VERT));
        gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FRAG_OPS));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    } catch (e) { out.error = String(e.message).slice(0, 600); return out; }
    const rt = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, rt);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 1, 1, 0, gl.RGBA, gl.FLOAT, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rt, 0);
    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.useProgram(prog);
    const loc = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const u = (n) => gl.getUniformLocation(prog, n);
    const buf = new Float32Array(4);
    const run = (op, input, p = [0, 0, 0], gamut = 0) => {
        gl.uniform1i(u('u_op'), op); gl.uniform1i(u('u_gamut'), gamut);
        gl.uniform3fv(u('u_in'), input); gl.uniform3fv(u('u_p'), p);
        gl.viewport(0, 0, 1, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, buf);
        return [buf[0], buf[1], buf[2]];
    };
    const pixels = [[0, 0, 0], [0.18, 0.18, 0.18], [0.6, 0.5, 0.4], [4, 2, 0.5], [-0.05, 0.2, 0.2], [0.002, 0.007, 0.01]];
    for (const px of pixels) {
        for (const [t, n] of [[0, 0], [0.5, 0], [-1, 0.3], [2, -2]]) {
            out.cases.push({ op: 'wb', in: px, p: [t, n], gpu: run(0, px, [t, n, 0]), cpu: applyWhiteBalance(px, t, n) });
        }
        for (const [ref, m] of [[0.3, 0], [0.3, 0.5], [0.0, 0], [2, 1]]) {
            out.cases.push({ op: 'lumaMix', in: px, p: [ref, m], gpu: run(1, px, [ref, m, 0]), cpu: applyLumaMix(px, ref, m) });
        }
        out.cases.push({ op: 'toCct', in: px, gpu: run(2, px), cpu: px.map(linToACEScct) });
        const cct = px.map((v) => v * 0.6);
        out.cases.push({ op: 'fromCct', in: cct, gpu: run(3, cct), cpu: cct.map(acescctToLin) });
        for (const g of [0, 1, 2, 3, 4]) {
            out.cases.push({ op: 'toAP1', in: px, gamut: g, gpu: run(4, px, [0, 0, 0], g), cpu: toAP1(px, g) });
            out.cases.push({ op: 'fromAP1', in: px, gamut: g, gpu: run(5, px, [0, 0, 0], g), cpu: fromAP1(px, g) });
            out.cases.push({ op: 'roundTrip', in: px, gamut: g, gpu: run(6, px, [0, 0, 0], g), cpu: px });
        }
    }
    out.ok = true;
    return out;
};
</script>
</body>
</html>
