<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiance</title>
<link rel="stylesheet" href="./studio.css">
</head>
<body>
<div id="studio" class="st" aria-busy="true">
  <aside class="st-side" aria-label="Radiance">
    <div class="st-brand">
      <svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#1C1C1E"/><path d="M52.2 28.4A24 24 0 1 0 71.6 47.8" fill="none" stroke="#F5F5F7" stroke-width="14"/><rect x="58" y="28" width="14" height="14" rx="3" fill="#0A84FF"/></svg>
      <div class="st-brand-name">Radiance</div>
    </div>
    <label class="st-project">
      <span class="st-visually-hidden">Project</span>
      <select id="stProject" aria-label="Project"></select>
    </label>
    <nav class="st-nav" id="stNav" aria-label="Radiance"></nav>
    <div class="st-grow"></div>
    <div class="st-gpu" id="stGpu" hidden>
      <div class="st-row-between"><span class="st-sec">GPU</span><span class="st-ok st-small" id="stGpuState">Ready</span></div>
      <div class="st-gpu-name" id="stGpuName"></div>
      <div class="st-meter"><div id="stGpuBar"></div></div>
      <div class="st-row-between"><span class="st-dim st-small" id="stGpuLabel"></span><button type="button" class="st-link" id="stFree">Free memory</button></div>
    </div>
    <div class="st-me"><span class="st-avatar" id="stAvatar">R</span><span><span class="st-me-name" id="stMe">Radiance</span><span class="st-dim st-small" id="stRole">Artist</span></span></div>
  </aside>
  <div class="st-main">
    <header class="st-top">
      <div class="st-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="stSearch" type="search" placeholder="Search workflows, gizmos, assets and shots" aria-label="Search" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="st-grow"></div>
      <button type="button" class="st-btn" id="stImport"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"/></svg>Import</button>
      <button type="button" class="st-btn st-primary" id="stNew" title="Open the Starter workflow on the canvas"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</button>
      <input type="file" id="stImportFile" accept=".rad,.json" hidden>
      <input type="file" id="stUploadFile" multiple hidden>
      <input type="file" id="stGizmoFile" accept=".gizmo,.json" hidden>
    </header>
    <main class="st-body" id="stBody"></main>
  </div>
  <div class="st-toast" id="stToast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="./studio.mjs"></script>
</body>
</html>
