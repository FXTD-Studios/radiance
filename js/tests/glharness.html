<!doctype html>
<!--
  GPU harness for the OpenColorIO display transform.

  `radiance_viewer.js` cannot be loaded in Node and a fragment shader cannot be
  compiled there at all, so the one thing that most plausibly breaks about this
  feature — splicing OpenColorIO's generated GLSL into the composite shader —
  has no coverage from the rest of the suite. This page is that coverage: it
  runs in headless Chromium, compiles the real spliced shader, uploads the real
  LUT textures, renders known pixels, and compares the GPU's answer to
  OpenColorIO's own CPU answer for the same transform.

  It is a page rather than a test file because it needs a real WebGL2 context.
  `js/tests/ocio_gpu.test.mjs` drives it and is what CI runs.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Radiance — OCIO GPU harness</title></head>
<body>
<canvas id="c" width="8" height="8"></canvas>
<script type="module">
import {
    initOCIO, loadConfig, buildDisplayView, prepareShaderSource,
    OCIO_TEXTURE_UNIT_BASE,
} from '../radiance_ocio.js';

const VERT = `#version 300 es
in vec2 a_position;
out vec2 v_texcoord;
void main() {
    v_texcoord = a_position * 0.5 + 0.5;
    gl_Position = vec4(a_position, 0.0, 1.0);
}`;

// The same splice the composite shader performs: OCIO's block verbatim, then a
// main() that calls its entry point. Deliberately minimal — this is testing the
// splice and the resource binding, not the rest of the grade pipeline.
const frag = (ocioBlock) => `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
precision highp sampler3D;
in vec2 v_texcoord;
out vec4 fragColor;
uniform vec3 u_input;
uniform bool u_ocioEnabled;
${ocioBlock}
void main() {
    vec3 color = u_input;
    // The renderer's exact-zero nudge, mirrored: GLSL leaves pow(0, y<=0)
    // undefined and OCIO's inverse-EOTF chains reach it, so scene-linear black
    // comes back as NaN or ~1e16 without this.
    if (u_ocioEnabled) {
        vec3 ocioIn = mix(color, vec3(1e-10), vec3(equal(color, vec3(0.0))));
        color = OCIODisplay(vec4(ocioIn, 1.0)).rgb;
    }
    fragColor = vec4(color, 1.0);
}`;

function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s);
        gl.deleteShader(s);
        return { error: log };
    }
    return { shader: s };
}

function program(gl, vsSrc, fsSrc) {
    const vs = compile(gl, gl.VERTEX_SHADER, vsSrc);
    if (vs.error) return { error: 'vertex: ' + vs.error };
    const fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc);
    if (fs.error) return { error: 'fragment: ' + fs.error };
    const p = gl.createProgram();
    gl.attachShader(p, vs.shader);
    gl.attachShader(p, fs.shader);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return { error: 'link: ' + gl.getProgramInfoLog(p) };
    return { program: p };
}

// The same upload the renderer performs. A 1-channel LUT uploaded as RGB would
// read the wrong samples per texel, so the format choice is part of what is
// under test here.
function uploadOcioTexture(gl, t) {
    const tex = gl.createTexture();
    const target = t.dimensions === 3 ? gl.TEXTURE_3D : gl.TEXTURE_2D;
    const internal = t.channels === 1 ? gl.R32F : gl.RGB32F;
    const format = t.channels === 1 ? gl.RED : gl.RGB;
    // R32F is not filterable in WebGL2 unless this extension is *enabled* --
    // having it listed in getSupportedExtensions() is not enough. Without the
    // call, LINEAR sampling of a LUT returns zero and every HDR view renders
    // black with no error reported anywhere. This mirrors the renderer.
    const floatLinear = !!gl.getExtension('OES_texture_float_linear');
    const filter = (/nearest/i.test(t.interpolation || '') || !floatLinear) ? gl.NEAREST : gl.LINEAR;
    gl.bindTexture(target, tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    if (t.dimensions === 3) {
        gl.texImage3D(target, 0, internal, t.width, t.height, t.depth, 0, format, gl.FLOAT, t.values);
        gl.texParameteri(target, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } else {
        gl.texImage2D(target, 0, internal, t.width, t.height, 0, format, gl.FLOAT, t.values);
    }
    gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(target, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(target, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
}

window.__run = async () => {
    const out = { ok: false, cases: [], notes: [] };
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl2');
    if (!gl) { out.error = 'no webgl2 context'; return out; }
    // Rendering to a float target so the comparison is not quantised to 8 bits
    // before it is made.
    if (!gl.getExtension('EXT_color_buffer_float')) {
        out.error = 'EXT_color_buffer_float unavailable — cannot read back float';
        return out;
    }
    out.renderer = gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER);
    out.maxTextureUnits = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);

    const boot = await initOCIO();
    if (!boot.ok) { out.error = boot.error; return out; }
    out.ocioVersion = boot.version;

    const cfg = await loadConfig({ builtin: 'ocio://cg-config-v2.2.0_aces-v1.3_ocio-v2.4' }, { name: 'ACES CG' });
    if (cfg.error) { out.error = cfg.error; return out; }

    // Float render target.
    const fbo = gl.createFramebuffer();
    const rt = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, rt);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 8, 8, 0, gl.RGBA, gl.FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rt, 0);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

    // Every display in the config, at its first view: the SDR path, the HDR PQ
    // paths and the pass-through all splice differently.
    const targets = cfg.displays.map((d) => ({ display: d, view: cfg.viewsByDisplay[d][0] }));
    const probes = [[0.18,0.18,0.18], [0.0,0.0,0.0], [1.0,1.0,1.0], [4.0,2.0,0.5], [0.05,0.2,0.9]];

    for (const { display, view } of targets) {
        const rec = { display, view };
        const built = buildDisplayView(cfg.config, { source: 'ACEScg', display, view });
        if (built.error) { rec.error = built.error; out.cases.push(rec); continue; }

        rec.textures = built.textures.length;
        rec.uniforms = built.uniforms.length;
        rec.isNoOp = built.isNoOp;

        const prep = prepareShaderSource(built.shaderText);
        rec.stripped = prep.stripped;
        const prog = program(gl, VERT, frag(prep.source));
        if (prog.error) { rec.error = prog.error.slice(0, 800); out.cases.push(rec); continue; }
        rec.compiled = true;

        gl.useProgram(prog.program);
        const loc = gl.getAttribLocation(prog.program, 'a_position');
        gl.enableVertexAttribArray(loc);
        gl.bindBuffer(gl.ARRAY_BUFFER, quad);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        const texes = built.textures.map((t, i) => {
            const tex = uploadOcioTexture(gl, t);
            gl.activeTexture(gl.TEXTURE0 + OCIO_TEXTURE_UNIT_BASE + i);
            gl.bindTexture(t.dimensions === 3 ? gl.TEXTURE_3D : gl.TEXTURE_2D, tex);
            gl.uniform1i(gl.getUniformLocation(prog.program, t.samplerName), OCIO_TEXTURE_UNIT_BASE + i);
            return tex;
        });
        gl.uniform1i(gl.getUniformLocation(prog.program, 'u_ocioEnabled'), 1);

        rec.probes = [];
        const buf = new Float32Array(8 * 8 * 4);
        for (const p of probes) {
            gl.uniform3f(gl.getUniformLocation(prog.program, 'u_input'), p[0], p[1], p[2]);
            gl.viewport(0, 0, 8, 8);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.readPixels(0, 0, 8, 8, gl.RGBA, gl.FLOAT, buf);
            const gpuRGB = [buf[0], buf[1], buf[2]];
            const cpu = built.cpu(Float32Array.from([p[0], p[1], p[2], 1]));
            const cpuRGB = [cpu[0], cpu[1], cpu[2]];
            const maxDelta = Math.max(...gpuRGB.map((v, i) => Math.abs(v - cpuRGB[i])));
            rec.probes.push({ in: p, gpu: gpuRGB, cpu: cpuRGB, maxDelta });
        }
        texes.forEach((t) => gl.deleteTexture(t));
        gl.deleteProgram(prog.program);
        out.cases.push(rec);
    }

    // The no-config case: the stub entry point must still compile, because the
    // composite shader always declares the call site.
    const stub = program(gl, VERT, frag('vec4 OCIODisplay(vec4 inPixel) { return inPixel; }'));
    out.stubCompiles = !stub.error;
    if (stub.error) out.stubError = stub.error.slice(0, 400);

    out.ok = true;
    return out;
};
</script>
</body>
</html>
